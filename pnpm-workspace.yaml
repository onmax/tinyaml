packages:
  - packages/*
  # The website, private so the release skips it.
  - docs

# The code that ViteHub generates into docs/.vitehub imports its @vite-hub/* packages by name, from the docs app.
publicHoistPattern:
  - "@vite-hub/*"

allowBuilds:
  # esbuild's binary comes from its platform package; the postinstall only checks it.
  esbuild: false
  # ViteHub's optional dependencies (zstd, swc, cbor-extract, cpu-features, liblzma, ssh2) are not used by the docs.
  "@mongodb-js/zstd": false
  "@swc/core": false
  cbor-extract: false
  cpu-features: false
  msgpackr-extract: true
  node-liblzma: false
  ssh2: false
  workerd: true

# ViteHub 0.1.0 and comark-ui 0.8.0, which the website uses, came out within a day of the move to them.
minimumReleaseAgeExclude:
  - "@vite-hub/agent@0.1.0"
  - "@vite-hub/auth@0.1.0"
  - "@vite-hub/blob@0.1.0"
  - "@vite-hub/browser@0.1.0"
  - "@vite-hub/channels@0.1.0"
