packages:
  - packages/*
  # The website, private so the release skips it.
  - docs

overrides:
  # comark-content 0.4.1, which @vite-hub/content reads pages through, asks for comark 0.7, and the comark-ui preset
  # needs 0.8's parser.
  "comark-content>comark": ^0.8.1

allowBuilds:
  # esbuild's binary comes from its platform package; the postinstall only checks it.
  esbuild: false
  # automd only needs @parcel/watcher for --watch, which the scripts don't use.
  "@parcel/watcher": false
  # Optional dependencies of the ViteHub packages that @vite-hub/content brings (zstd, swc, cbor-extract, cpu-features,
  # liblzma, ssh2), which the docs don't use.
  "@mongodb-js/zstd": false
  "@swc/core": false
  cbor-extract: false
  cpu-features: false
  msgpackr-extract: true
  node-liblzma: false
  ssh2: false
  workerd: true

# The Nuxt 5 nightly, ViteHub 0.1.0 and comark-ui 0.8.0, which the website uses, came out within a day of the move to
# them.
minimumReleaseAgeExclude:
  - "@nuxt/kit-nightly@5.0.0-2611010234-c709ec8"
  - "@nuxt/nitro-server-nightly@5.0.0-2611010234-c709ec8"
