[metadata]
name = example
version = attr: example.__version__
description = An example package; with a semicolon
long_description = file: README.md
classifiers =
    Programming Language :: Python :: 3

[options]
packages = find:
python_requires = >=3.9
install_requires =
    requests>=2.0
    click

[options.entry_points]
console_scripts =
    example = example.cli:main

[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude = .git,__pycache__,build,dist

[tool:pytest]
addopts = -ra -q
testpaths = tests
