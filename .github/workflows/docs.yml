name: Docs

# The website deploys from main only. Branches and pull requests build nothing here. Besides docs/, the site copies the
# brand from .github/assets/ and tinyaml's charts from packages/tinyaml/.github/.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/assets/**"
      - "packages/tinyaml/.github/*.svg"
      - "wrangler.jsonc"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# A deploy finishes before the next one starts, so main's latest push always wins.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: docs
      url: https://tiny.onmax.me
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:generate
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
